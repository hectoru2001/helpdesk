{% extends "base.html" %}
{% block title %} <h5 class="title-secondary">Editar usuario</h5> {% endblock %}
{% block content %}
{% include "mensajes.html" %}

<div class="my-4">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <div class="mt-4 pt-3 border-top text-end">
                    <button type="submit" class="btn btn-primary px-4">Guardar usuario</button>
                    <a href="{% url 'lista_usuarios' %}" class="btn btn-outline-secondary ms-2">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
