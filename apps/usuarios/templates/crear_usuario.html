{% extends "base.html" %}
{% block title %} <h5 class="title-secondary"> Crear usuario </h5> {% endblock %}
{% block content %}
{% include "mensajes.html" %}

<div class="container mt-4">
    <form method="post">
        {% csrf_token %}

        <div class="row g-3">
            <!-- Primera fila -->
            <div class="col-md-6">
                <label class="form-label fw-bold">{{ form.empleado.label }}</label>
                {{ form.empleado }}
            </div>
            
            <div class="col-md-6">
                <label class="form-label fw-bold">{{ form.tipo.label }}</label>
                {{ form.tipo }}
            </div>

            <!-- Segunda fila -->
            <div class="col-md-6">
                <label class="form-label fw-bold">{{ form.first_name.label }}</label>
                {{ form.first_name }}
            </div>
            
            <div class="col-md-6">
                <label class="form-label fw-bold">{{ form.last_name.label }}</label>
                {{ form.last_name }}
            </div>

            <!-- Tercera fila -->
            <div class="col-md-6">
                <label class="form-label fw-bold">{{ form.email.label }}</label>
                {{ form.email }}
            </div>
            
            <div class="col-md-6">
                <label class="form-label fw-bold">{{ form.username.label }}</label>
                {{ form.username }}
            </div>

            <!-- Cuarta fila - Contraseña ocupa toda la fila -->
            <div class="col-12">
                <label class="form-label fw-bold">{{ form.password.label }}</label>
                {{ form.password }}
            </div>
        </div>

        <div class="mt-4 pt-3 border-top text-end">
            <button type="submit" class="btn btn-primary px-4">Guardar usuario</button>
            <a href="{% url 'lista_usuarios' %}" class="btn btn-outline-secondary ms-2">Cancelar</a>
        </div>
    </form>
</div>

{% endblock %}
